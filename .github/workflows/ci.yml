name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ConferenceRoomBooking.sln

      - name: Build
        run: dotnet build ConferenceRoomBooking.sln --no-restore --configuration Release

      - name: Run Unit Tests
        run: >
          dotnet test tests/ConferenceRoomBooking.UnitTests/ConferenceRoomBooking.UnitTests.csproj
          --no-build
          --configuration Release

      - name: Run Integration Tests
        run: >
          dotnet test tests/ConferenceRoomBooking.IntegrationTests/ConferenceRoomBooking.IntegrationTests.csproj
          --no-build
          --configuration Release