name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ConferenceRoomBooking.sln

      - name: Build
        run: dotnet build ConferenceRoomBooking.sln --no-restore --configuration Release

      - name: Run Unit Tests
        run: >
          dotnet test tests/ConferenceRoomBooking.UnitTests/ConferenceRoomBooking.UnitTests.csproj
          --no-build
          --configuration Release

      - name: Run Integration Tests
        run: >
          dotnet test tests/ConferenceRoomBooking.IntegrationTests/ConferenceRoomBooking.IntegrationTests.csproj
          --no-build
          --configuration Release
          
      - name: Start E2E environment
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8080/api/rooms; then
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo "API did not become ready"
          docker compose -f docker-compose.e2e.yml logs
          exit 1

      - name: Run E2E Tests
        run: >
          dotnet test tests/ConferenceRoomBooking.E2ETests/ConferenceRoomBooking.E2ETests.csproj
          --no-build
          --configuration Release

      - name: Stop E2E environment
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v