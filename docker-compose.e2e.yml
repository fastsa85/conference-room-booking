services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"

  api:
    build:
      context: .
      dockerfile: src/ConferenceRoomBooking.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ConferenceRoomBooking;User Id=sa;Password=Your_password123;TrustServerCertificate=True"

    ports:
      - "8080:8080"

    depends_on:
      - sqlserver